name: CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to release"
        required: true
        default: "1.0.0"
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the package
        run: |
          mkdir -p dist
          zip -r dist/tasks-api-${{ inputs.version }}.zip src package.json README.md
          echo "Created package:"
          ls -l dist
          unzip -l dist/tasks-api-${{ inputs.version }}.zip

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            "dist/tasks-api-${{ inputs.version }}.zip" \
            --target "${{ github.sha }}" \
            --title "Release v${{ inputs.version }}" \
            --generate-notes

      - name: Print the version
        run: echo "Released version ${{ inputs.version }}"